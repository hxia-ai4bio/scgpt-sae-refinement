[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scgpt-sae-refinement"
version = "0.1.0"
description = "Sparse reconstruction and biological interpretation of frozen scGPT embeddings"
requires-python = ">=3.9"
authors = [{name="Xia Haoxiang"}, {name="Chang Runjia"}, {name="Xiao Jiahao"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11", "torch>=2.3", "scikit-learn>=1.3", "threadpoolctl>=3"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8", "pandas>=2.0", "Pillow>=10"]
analysis = ["h5py>=3.10", "seaborn>=0.13", "statsmodels>=0.14", "igraph>=0.11", "leidenalg>=0.10", "psutil>=5"]

[project.scripts]
sae-refine = "sae_refinement.train:main"

[tool.setuptools.packages.find]
where = ["src"]
